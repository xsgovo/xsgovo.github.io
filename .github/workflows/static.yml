# 构建 Astro 博客并将产物部署到 GitHub Pages
name: Deploy static content to Pages

on:
  # 推送到默认分支时构建并部署
  push:
    branches: ["main"]

  # 允许在 Actions 页手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，跳过排队中的运行；
# 但不取消进行中的部署，让生产部署完整跑完
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 版本自动读取 package.json 的 packageManager 字段（pnpm@11.15.1）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm check

      # 项目约定：构建前清除 content layer / vite 缓存，
      # 防止沿用旧渲染 HTML 导致样式链接与产物脱节
      - name: Clean build caches
        run: rm -rf .astro node_modules/.astro node_modules/.vite

      # prebuild 生成图标，随后 astro build + pagefind 生成搜索索引
      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传构建产物而非整个仓库
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
