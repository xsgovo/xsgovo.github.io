# 构建 Astro 博客并部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版本读 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
      - name: Install & check
        run: pnpm install --frozen-lockfile && pnpm check
      - name: Sync bangumi data
        # 防御：sync 脚本在请求全挂时会静默写空快照并退出 0，校验非空防止部署空页面
        run: pnpm anime:sync && node -e "const j=require('./src/data/anime-snapshots/bangumi.json'); if (!j.items?.length) { console.error('anime snapshot is empty'); process.exit(1); }"
      - name: Build
        # 按项目约定构建前清缓存，防止 content layer 沿用旧渲染
        run: rm -rf .astro node_modules/.astro node_modules/.vite && pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
